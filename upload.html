<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">

		<title>WrapperTube II - Upload</title>
	</head>
	<body topmargin="0" bottommargin="0" leftmargin="0" rightmargin="0">
		<table width="90%" align="center" border="0" cellpadding="10" cellspacing="0" class="main">
			<tr class="headice">
				<td class="logo">
					<b><a href="index.html"><img src="images/logo.png" border="0" width="28" height="28" style="vertical-align:middle;"> WrapperTube II</a></b>
				</td>
				<td class="searchbar">
				<form method="get" action="search.html">
					<table border="0" cellpadding="2" cellspacing="0">
					<tr>
					<td width="100%">
						<input type="text" placeholder="Search" name="q" class="searchbox">
						</td>
						<td>
						<input type="submit" value="Search">
						</td>
						</tr>
					</table>
				</form>
				</td>
				<td width="1" align="center">
					<a href="browse.html">Browse</a>
				</td>
				<td width="1" align="center">
					<a href="scratch.html">Scratch</a>
				</td>
				<td width="1" align="center">
					<a href="paint.html">Paint</a>
				</td>
				<td width="1" align="center">
					<a href="upload.html">Upload</a>
				</td>
				<td width="1" align="center">
					<a href="community.html">Community</a>
				</td>
				<td width="1" align="center">
					<a href="login.html">Login</a>
				</td>
			</tr>
			<tr class="bodie">
				<td colspan="8">
					<h2>Upload to WrapperTube II</h2>
					<form action="" method="post" enctype="multipart/form-data">
						Title<br>
						<input type="text" name="title" /><br>
						Description<br>
						<textarea name="description" rows="6" cols="50"></textarea><br>
						Tags (separate with commas)<br>
						<input type="text" name="tags" /><br>
						File<br>
						<input type="file" name="file" /><br>
						Thumbnail<br>
						<input type="file" name="thumbnail" /><br>
						Category<br>
						<select name="category">
                                                                                                                                        <option value="None">None</option>
                                                                                            <option value="Film &amp; Animation">Film &amp; Animation</option>
                                                                                            <option value="Autos &amp; Vehicles">Autos &amp; Vehicles</option>
                                                                                            <option value="Music">Music</option>
                                                                                            <option value="Pets &amp; Animals">Pets &amp; Animals</option>
                                                                                            <option value="Sports">Sports</option>
                                                                                            <option value="Travel &amp; Events">Travel &amp; Events</option>
                                                                                            <option value="Gaming">Gaming</option>
                                                                                            <option value="People &amp; Blogs">People &amp; Blogs</option>
                                                                                            <option value="Comedy">Comedy</option>
                                                                                            <option value="Entertainment">Entertainment</option>
                                                                                            <option value="News &amp; Politics">News &amp; Politics</option>
                                                                                            <option value="Howto &amp; Style">Howto &amp; Style</option>
                                                                                            <option value="Education">Education</option>
                                                                                            <option value="Science &amp; Technology">Science &amp; Technology</option>
                                                                                            <option value="Nonprofits &amp; Activism">Nonprofits &amp; Activism</option>
                                                                                            <option value="Poop-posting">Poop-posting</option>
                                                                                    </select><br>
						Privacy<br>
						<select name="privacy">
                                                                                                                                        <option value="Public">Public</option>
                                                                                            <option value="Unlisted">Unlisted</option>
                                                                                            <option value="Private">Private</option>
                                                                                    </select><br>
						<p><input type="submit" value="Upload"></p>
					</form>
				</td>
			</tr>
			<tr class="foot">
				<td colspan="8">
					<hr class="clearfloat">

				</td>
			</tr>

	</body>
</html>
